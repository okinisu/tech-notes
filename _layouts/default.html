<!doctype html>
<html lang="{{ site.lang | default: 'ja' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">本文へ移動</a>
    <header class="site-header">
      <div class="container">
        <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
        <nav aria-label="分野別ナビゲーション">
          {% for category in site.data.categories %}
          <a href="{{ category.url | relative_url }}"{% if page.category == category.id %} class="active"{% endif %}{% if page.url == category.url %} aria-current="page"{% endif %}>{{ category.title | escape }}</a>
          {% endfor %}
        </nav>
      </div>
    </header>
    <main id="main" class="container" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer container">
      <span>Okinisu · tech-notes</span>
      <a href="https://github.com/okinisu/tech-notes">GitHub</a>
    </footer>
  </body>
</html>
