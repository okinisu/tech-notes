title: tech-notes
description: 競技プログラミング・ロボット開発・CTF・一般開発・数学・Web3の参考資料と技術メモ
lang: ja
url: https://okinisu.github.io
baseurl: /tech-notes
markdown: kramdown
highlighter: rouge
timezone: Asia/Tokyo

collections:
  topics:
    output: true
    permalink: /:path/
  notes:
    output: true
    permalink: /notes/:path/

defaults:
  - scope:
      path: ""
    values:
      layout: default
  - scope:
      path: ""
      type: notes
    values:
      layout: note
  - scope:
      path: ""
      type: topics
    values:
      layout: topic

exclude:
  - README.md
  - templates
  - Gemfile
  - Gemfile.lock
  - vendor
